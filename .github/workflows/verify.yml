name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:package
      - run: npm audit --audit-level=low
      - run: git diff --check "origin/$BASE_REF"...HEAD
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
